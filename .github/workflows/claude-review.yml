# PR が作られる・更新されるたびに Claude がレビューする(コメントのみ。コードは変更しない)
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # Autopilot が、起動しなかった PR のレビューを直接動かすために使う(PR のブランチを ref に指定して呼ぶ)
  workflow_dispatch:
    inputs:
      pr:
        description: "レビューする PR 番号"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: sakurai スキルを読み込む(コミット固定)
        run: |
          git clone -q https://github.com/kociden/sakurai-skill /tmp/sakurai-skill
          git -C /tmp/sakurai-skill checkout -q 913dc46b9dedc5e0b12e3834d25d684cf8213f87
          mkdir -p .claude/skills
          cp -r /tmp/sakurai-skill/skills/sakurai .claude/skills/
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude が作った PR もレビューする(bot 起動のイベントは標準では拒否されるため)
          allowed_bots: "claude,claude[bot],github-actions,github-actions[bot]"
          prompt: |
            リポジトリ ${{ github.repository }} の PR #${{ github.event.pull_request.number || inputs.pr }} をレビューしてください。
            実装者とは別の目で、次の観点を見ること。
            1. 対応する Issue の受け入れ条件を満たしているか
            2. CLAUDE.md の規約(ロジックを src/logic/ に分離、テストの有無、依存追加の理由)
            3. バグ・パフォーマンス(毎フレームの無駄な生成など)
            4. docs/GAME_DESIGN.md の世界観(モノクロ、静けさ)から外れていないか
            5. sakurai スキルの観点で、操作感・見やすさ(判定のある物が背景から見分けられるか等)・遊びやすさに問題がないか。該当するときは原則とその出典を短く添える
            問題点は該当行にインラインコメントし、最後に全体のまとめを1件コメントする。
            人が実際に遊んで確認すべき点があれば「人の確認が必要」として明記する。
          claude_args: |
            --max-turns 20
            --allowedTools "Skill,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
